name: Bug report
description: Report a defect in the plugin.
labels: [bug, triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Runtime (boot, components, framework wiring)
        - Settings
        - Blocks and scripts
        - CI workflows (.github/workflows/) and release
        - Documentation
        - Other or unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version or commit
      placeholder: 'x.y.z or trunk@<sha>'
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 'x.y.z'
    validations:
      required: true

  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: 'x.y.z'
    validations:
      required: true

  - type: input
    id: wc-version
    attributes:
      label: WooCommerce version, if active
      placeholder: 'x.y.z'

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Activate the plugin.
        2. Go to …
        3. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, stack traces or a CI run URL
      render: text
