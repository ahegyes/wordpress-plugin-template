name: Feature request
description: Propose a new capability for the plugin.
labels: [enhancement, triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Target area
      options:
        - Runtime (boot, components, framework wiring)
        - Settings
        - Blocks and scripts
        - CI workflows (.github/workflows/) and release
        - Documentation
        - New area or unsure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve, and for whom?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work? Code samples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you weigh, and why this one?
