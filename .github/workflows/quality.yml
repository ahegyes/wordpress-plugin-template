name: Quality

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  lint-php:
    name: PHP Lint
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-lint.yml@trunk
    with:
      php-version: '8.5'
      scripts: '["lint:php:phpcs", "lint:php:phpstan"]'

  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: composer changelog:validate

  readme-lint:
    name: readme.txt lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: thetwopct/wporg-plugin-readme-linter@v1
        with:
          path: readme.txt
          fail-on: error
