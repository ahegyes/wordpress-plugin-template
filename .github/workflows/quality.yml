name: Quality

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  lint-php:
    name: PHP Lint
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-lint.yml@3cbd985255e76f8026644ccdee5be0b2b2da312b
    with:
      php-version: '8.5'
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  lint-scripts-styles:
    name: Scripts and styles lint
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-scripts-styles-lint.yml@3cbd985255e76f8026644ccdee5be0b2b2da312b
    with:
      scripts: '["lint:scripts", "lint:styles", "lint:types"]'

  block-json:
    name: block.json schema
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-block-json-check.yml@3cbd985255e76f8026644ccdee5be0b2b2da312b

  slug:
    name: Plugin slug
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub refuses a GITHUB_TOKEN push that changes a workflow, so the fill-in leaves workflows alone and they read the slug the plugin declares.
      - name: Read the slug from composer.json
        id: slug
        run: |
          slug=$(jq -r '.extra["text-domain"] // empty' composer.json)
          if ! [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::composer.json's extra.text-domain must be the plugin's kebab-case slug — got '$slug'."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

  php-syntax:
    name: PHP syntax
    needs: slug
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-syntax-check.yml@3cbd985255e76f8026644ccdee5be0b2b2da312b
    with:
      php-versions: '["7.4"]'
      paths: ${{ format('["{0}.php", "uninstall.php", "includes"]', needs.slug.outputs.slug) }}

  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer changelog:validate

  scaffold:
    name: Scaffold rehearsal
    # A plugin generated from the template has filled in its placeholders already, so only the template rehearses the fill-in.
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: 'npm'
      - name: Fill in the scaffold
        env:
          PLUGIN_NAME: Acme Orders
          SLUG: acme-orders
          NS: AcmeOrders
          PREFIX: dws_ao
          PORT: '8821'
          REPO: acme/acme-orders
        run: .github/scripts/fill-in-scaffold.sh
      - name: Install and scope the filled-in plugin
        run: composer packages-install
      - name: Lint and unit-test the filled-in plugin
        run: |
          composer lint:php
          composer test:unit
      # The display name lands in the block's JSX, which only a build and the script and type lints parse.
      - name: Build and lint the filled-in plugin's scripts
        run: |
          npm run build
          npm run lint:scripts
          npm run lint:types
