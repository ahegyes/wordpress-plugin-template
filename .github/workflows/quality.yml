name: Quality

on:
  push:
    branches: [trunk]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-php:
    name: Lint PHP
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-lint.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      php-version: '8.5'
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan", "changelog:validate"]'

  lint-scripts-styles:
    name: Lint scripts and styles
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-scripts-styles-lint.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      scripts: '["lint:scripts", "lint:styles", "lint:types"]'

  block-json:
    name: block.json schema
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-block-json-check.yml@b107001cce9f2960495d9d50481c8540d228f60c

  slug:
    name: Plugin slug
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub refuses a GITHUB_TOKEN push that changes a workflow, so the fill-in leaves workflows alone and they read the slug the plugin declares.
      - name: Read the slug from composer.json
        id: slug
        run: |
          slug=$(jq -r '.extra["text-domain"] // empty' composer.json)
          if ! [[ "$slug" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]; then
            echo "::error::composer.json's extra.text-domain must be the plugin's kebab-case slug — got '$slug'."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

  php-syntax:
    name: PHP syntax
    needs: slug
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-php-syntax-check.yml@b107001cce9f2960495d9d50481c8540d228f60c
    with:
      php-versions: '["7.4"]'
      paths: ${{ format('["{0}.php", "uninstall.php", "includes"]', needs.slug.outputs.slug) }}

  scaffold:
    name: Scaffold rehearsal
    # A plugin generated from the template has filled in its placeholders already, so only the template rehearses the fill-in.
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: 'npm'
      - name: Check the scripts with ShellCheck
        run: shellcheck .github/scripts/*.sh
      - name: Fill in the scaffold
        env:
          PLUGIN_NAME: Acme Orders
          # The quotes and the backslash check that the manifests' JSON strings escape the description.
          DESCRIPTION: 'Acme Orders keeps a store''s "orders" in one place, C:\ included.'
          SLUG: acme-orders
          NS: AcmeOrders
          # The rehearsal fills in the longest prefix the script accepts, so its PHPCS run fails once the cap stops passing.
          PREFIX: dws_acmeextraordinarysales
          PORT: '8821'
          REPO: acme/acme-orders
        run: .github/scripts/fill-in-scaffold.sh
      - name: Install and scope the filled-in plugin
        run: composer packages-install
      - name: Lint and unit-test the filled-in plugin
        run: |
          composer lint:php
          composer test:unit
      # The display name lands in the block's editor script, which only a build and the script and type lints parse.
      - name: Build and lint the filled-in plugin's scripts
        run: |
          npm run build
          npm run lint:scripts
          npm run lint:types
      # Setting up PHP 7.4 replaces the PHP 8.5 the steps above need, so the fill-in job's last check runs last here too.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: none
      - name: Check the PHP 7.4 syntax
        run: |
          for file in acme-orders.php uninstall.php includes/*.php; do
            php -l "$file"
          done
