name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      php-version: '8.5'
      composer-script: 'test:unit'
      needs-wp-env: false

  wordpress:
    name: WordPress versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The floor is the plugin's Requires at least header, and WordPress's version API offers the newest release of every branch, so new releases and floors join without an edit here.
      - name: List the newest release of every branch from the floor up
        id: versions
        run: |
          floor=$(sed -nE 's|^[[:space:]/*#@]*Requires at least:[[:space:]]*([0-9]+(\.[0-9]+)*).*$|\1|p' dws-plugin-template.php | head -n 1)
          if [ -z "$floor" ]; then
            echo "::error::dws-plugin-template.php declares no Requires at least header."
            exit 1
          fi
          offers=$(curl -fsS https://api.wordpress.org/core/version-check/1.7/)
          versions=$(printf '%s' "$offers" | jq -c --arg floor "$floor" '[.offers[].version | select((split(".")[0:2] | map(tonumber)) >= ($floor | split(".") | map(tonumber)))] | unique | if length == 0 then error("No WordPress release at or above \($floor).") else . end')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration
    needs: wordpress
    strategy:
      fail-fast: false
      matrix:
        wp: ${{ fromJSON(needs.wordpress.outputs.versions) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-phpunit.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      composer-script: 'test:integration:run'
      wp-env-config-file: '.wp-env.tests.json'

  e2e:
    name: E2E
    needs: wordpress
    strategy:
      fail-fast: false
      matrix:
        wp: ${{ fromJSON(needs.wordpress.outputs.versions) }}
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-playwright-e2e.yml@88710a71e2bcc7db7cb81b4eb96411438369ce0f
    with:
      artifact-slug: wp-${{ matrix.wp }}
      php-version: '8.5'
      wp-version: ${{ matrix.wp }}
      wp-env-config-file: '.wp-env.tests.json'
