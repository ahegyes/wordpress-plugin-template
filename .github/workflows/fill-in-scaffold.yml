name: Fill in scaffold

on:
  workflow_dispatch:
    inputs:
      plugin-name:
        description: 'Display name (e.g. "Acme Orders")'
        required: true
        type: string
      plugin-slug:
        description: 'Kebab-case slug, also the text domain and the entry file name (e.g. "acme-orders")'
        required: true
        type: string
      php-namespace:
        description: 'PHP namespace segment after DeepWebSolutions\ (e.g. "AcmeOrders")'
        required: true
        type: string
      prefix:
        description: 'Prefix of the global functions, constants, options and hooks, dws_ plus one segment (e.g. "dws_ao")'
        required: true
        type: string
      wp-env-port:
        description: 'Development wp-env port; the tests environment takes the next one (e.g. "8821")'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fill-in:
    name: Fill in scaffold
    # Running it on the template would destroy the placeholders it exists to fill in.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The job pushes the filled-in plugin back, so the checkout keeps its credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Fill in the placeholders
        env:
          PLUGIN_NAME: ${{ inputs.plugin-name }}
          SLUG: ${{ inputs.plugin-slug }}
          NS: ${{ inputs.php-namespace }}
          PREFIX: ${{ inputs.prefix }}
          PORT: ${{ inputs.wp-env-port }}
          REPO: ${{ github.repository }}
        run: .github/scripts/fill-in-scaffold.sh

      - name: Commit and push
        env:
          SLUG: ${{ inputs.plugin-slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fill in scaffold: $SLUG"
          git push
