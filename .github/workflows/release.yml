name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    # A reusable workflow can't elevate above the caller's token; grant the provenance check's and the GitHub Release's scopes here.
    permissions:
      actions: read
      contents: write
    uses: ahegyes/wordpress-configs/.github/workflows/reusable-release.yml@a6a70735ba7a94628011b9856bf99159c490f7b5
    with:
      project-path: '.'
      plugin-slug: 'dws-plugin-template'
      wp-env-config-file: '.wp-env.tests.json'
      # Both parse every PHP file with php-parser 4, which stops at PHP 8.4 syntax such as protected(set).
      exclude-checks: 'prefixing,direct_file_access'
      # A pull request or a dispatch on a branch rehearses the release without publishing it.
      publish: ${{ github.ref_type == 'tag' }}
